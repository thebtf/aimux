name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector (Unix)
        if: runner.os != 'Windows'
        run: go test -race -coverprofile coverage.out -timeout 5m ./...

      - name: Test without race detector (Windows)
        if: runner.os == 'Windows'
        run: go test -timeout 5m ./...

      # AIMUX-16 CR-004 NFR-5 — ConPTY-specific verification on Windows.
      # Runs the conpty package tests verbosely and asserts that the real
      # CreatePseudoConsole path was exercised (TestProbeConPTY_RealHostSucceeds
      # AND TestOpenWindowsConPTY_SpawnsRealPseudoConsole both PASS, neither
      # SKIP). Skipping on Windows is PROHIBITED per spec — silent skip would
      # re-introduce the deferral pattern CR-004 was filed to fix.
      - name: ConPTY Windows verification (AIMUX-16 CR-004 NFR-5)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out=$(go test ./pkg/executor/conpty/... -timeout 2m -v -run 'TestProbeConPTY_RealHostSucceeds|TestOpenWindowsConPTY_SpawnsRealPseudoConsole|TestExecutor_Run_ProducesOutput' 2>&1)
          echo "$out"
          # Both happy-path tests MUST pass; neither may skip on a real Windows runner.
          for tc in TestProbeConPTY_RealHostSucceeds TestOpenWindowsConPTY_SpawnsRealPseudoConsole TestExecutor_Run_ProducesOutput; do
            if ! echo "$out" | grep -q "^--- PASS: $tc"; then
              echo "::error::AIMUX-16 CR-004 NFR-5 violated: $tc did not PASS on windows-latest" >&2
              exit 1
            fi
            if echo "$out" | grep -q "^--- SKIP: $tc"; then
              echo "::error::AIMUX-16 CR-004 NFR-5 violated: $tc SKIPPED on windows-latest" >&2
              exit 1
            fi
          done

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  archive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Build snapshot release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Verify archive payload, MCP startup, and skill prompts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/aimux_*_linux_amd64.tar.gz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected one Linux amd64 snapshot archive" >&2
            exit 1
          fi
          smoke=$(mktemp -d "$RUNNER_TEMP/aimux-archive-smoke.XXXXXX")
          tar -tzf "${archives[0]}" > "$smoke/entries.txt"
          for required in \
            aimux LICENSE README.md README.ru.md CHANGELOG.md RELEASE_NOTES.md \
            config/default.yaml \
            config/cli.d/claude/profile.yaml \
            config/cli.d/codex/profile.yaml \
            config/cli.d/gemini/profile.yaml \
            config/prompts.d/coding-rules.md \
            config/prompts.d/roles/coding.md \
            config/prompts.d/styles/concise.md \
            config/skills.d/developer/SKILL.md \
            config/skills.d/developer/evals/trigger-eval.json \
            config/skills.d/developer/evals/behavior-eval.json \
            config/skills.d/codereviewer/SKILL.md \
            config/skills.d/codereviewer/evals/trigger-eval.json \
            config/skills.d/codereviewer/evals/behavior-eval.json \
            config/skills.d/docs/SKILL.md \
            config/skills.d/docs/evals/trigger-eval.json \
            config/skills.d/docs/evals/behavior-eval.json \
            config/skills.d/pm/SKILL.md \
            config/skills.d/pm/evals/trigger-eval.json \
            config/skills.d/pm/evals/behavior-eval.json \
            config/p26/classification.v1.json \
            config/audit-rules.d/stub-detection.yaml; do
            if ! grep -Fxq "$required" "$smoke/entries.txt"; then
              echo "::error::Archive is missing $required" >&2
              exit 1
            fi
          done
          if grep -Eq '\.go$' "$smoke/entries.txt"; then
            echo "::error::Archive contains Go source" >&2
            exit 1
          fi
          mkdir -p "$smoke/payload" "$smoke/home" "$smoke/work" "$smoke/bin"
          tar -xzf "${archives[0]}" -C "$smoke/payload"
          ln -s "$smoke/payload/aimux" "$smoke/bin/aimux"
          export HOME="$smoke/home"
          export AIMUX_WARMUP=false
          export AIMUX_MCP_THINKING_ONLY=0
          export AIMUX_ENGINE_NAME="aimux-archive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export AIMUX_STDIN_EOF_POLICY=eager
          unset AIMUX_CONFIG_DIR
          cd "$smoke/work"
          coproc MCP { timeout --kill-after=5s 60s "$smoke/bin/aimux" 2> "$smoke/stderr.log"; }
          mcp_pid=$MCP_PID
          mcp_in=${MCP[1]}
          mcp_out=${MCP[0]}
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"archive-smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' >& "$mcp_in"
          : > "$smoke/responses.jsonl"
          tools_list_id=2
          for attempt in 1 2 3 4 5; do
            tools_catalog=''
            printf '{"jsonrpc":"2.0","id":%d,"method":"tools/list","params":{}}\n' "$tools_list_id" >& "$mcp_in"
            while IFS= read -r -t 60 response <& "$mcp_out"; do
              printf '%s\n' "$response" >> "$smoke/responses.jsonl"
              if jq -e --argjson id "$tools_list_id" 'select(.id == $id)' <<< "$response" > /dev/null; then
                tools_catalog=$response
                break
              fi
            done
            if jq -e '.result.tools | type == "array"' <<< "$tools_catalog" > /dev/null; then
              break
            fi
            if [[ $attempt -eq 5 ]] || ! jq -e '.error.code == -32603 and (.error.message | startswith("project not connected:"))' <<< "$tools_catalog" > /dev/null; then
              break
            fi
            sleep 1
            tools_list_id=$((attempt + 11))
          done
          cat "$smoke/responses.jsonl"
          jq -se --argjson tools_id "$tools_list_id" '
            [.[] | select(.id == 1)] as $initialize |
            [.[] | select(.id == $tools_id)] as $tools |
            ($initialize | length) == 1 and
            $initialize[0].result.protocolVersion == "2024-11-05" and
            ($tools | length) == 1 and
            $tools[0].error == null and
            ($tools[0].result.tools | type) == "array" and
            ($tools[0].result.tools | length) == 29
          ' "$smoke/responses.jsonl"

          prompt_list_id=3
          for attempt in 1 2 3 4 5; do
            prompt_catalog=''
            printf '{"jsonrpc":"2.0","id":%d,"method":"prompts/list","params":{}}\n' "$prompt_list_id" >& "$mcp_in"
            while IFS= read -r -t 60 response <& "$mcp_out"; do
              printf '%s\n' "$response" >> "$smoke/responses.jsonl"
              if jq -e --argjson id "$prompt_list_id" 'select(.id == $id)' <<< "$response" > /dev/null; then
                prompt_catalog=$response
                break
              fi
            done
            if jq -e '.result.prompts | type == "array"' <<< "$prompt_catalog" > /dev/null; then
              break
            fi
            if [[ $attempt -eq 5 ]] || ! jq -e '.error.code == -32603 and (.error.message | startswith("project not connected:"))' <<< "$prompt_catalog" > /dev/null; then
              break
            fi
            sleep 1
            prompt_list_id=$((attempt + 7))
          done
          jq -e '
            [.result.prompts[].name] | sort ==
            ["background", "codereviewer", "developer", "docs", "guide", "investigate", "pm", "workflow"]
          ' <<< "$prompt_catalog"
          jq -c '
            .result.prompts |
            map(select(.name == "developer" or .name == "codereviewer" or .name == "docs" or .name == "pm")) |
            sort_by(.name) | to_entries[] |
            .value.name as $name |
            {jsonrpc: "2.0", id: (.key + 4), method: "prompts/get", params: {
              name: $name,
              arguments: ((.value.arguments // []) | map({key: .name, value:
                (if .name == "as_gate" then "true" else "archive-argument-" + $name + "-" + .name end)
              }) | from_entries)
            }}
          ' <<< "$prompt_catalog" > "$smoke/prompts-requests.jsonl"
          while IFS= read -r request; do
            request_id=$(jq -r '.id' <<< "$request")
            printf '%s\n' "$request" >& "$mcp_in"
            while IFS= read -r -t 60 response <& "$mcp_out"; do
              printf '%s\n' "$response" >> "$smoke/responses.jsonl"
              if jq -e --argjson id "$request_id" 'select(.id == $id)' <<< "$response" > /dev/null; then
                break
              fi
            done
          done < "$smoke/prompts-requests.jsonl"
          exec {mcp_in}>&-
          if ! wait "$mcp_pid"; then
            cat "$smoke/stderr.log" >&2
            exit 1
          fi
          cat "$smoke/responses.jsonl"
          jq -se --slurpfile requests "$smoke/prompts-requests.jsonl" '
            . as $responses |
            [.[] | select(.id == 1)] as $initialize |
            ($initialize | length) == 1 and
            $initialize[0].result.protocolVersion == "2024-11-05" and
            $initialize[0].result.capabilities.prompts != null and
            ($requests | length) == 4 and
            all($requests[];
              . as $request |
              [$responses[] | select(.id == $request.id)] as $reply |
              ($reply | length) == 1 and $reply[0].error == null and
              ($reply[0].result.messages | length) > 0 and
              ([$reply[0].result.messages[].content.text // ""] | join("\n") |
                . as $text | all($request.params.arguments[]; . as $value | $text | contains($value)))
            )
          ' "$smoke/responses.jsonl"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
        continue-on-error: true # golangci-lint v2.1.6 built with Go 1.24, go.mod targets 1.26.9

  loom-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Build loom examples
        working-directory: loom
        run: go build ./examples/...

  stub-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stub grep scanner (Constitution P17)
        run: bash scripts/stub-grep.sh .
        continue-on-error: true # informational until v3 stubs are fixed

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"

      - name: Dead code analysis
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          deadcode -test ./... 2>&1 | grep -v "_test.go" | head -20 || true
        continue-on-error: true
